name: Compilar APK Agenda Escolar
on:
  workflow_dispatch:
  push:
    branches: [agenda-escolar-apk]
    paths: ['AgendaEscolar/**', '.github/workflows/agenda-escolar-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgendaEscolar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: agenda-escolar-apk
          path: AgendaEscolar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
